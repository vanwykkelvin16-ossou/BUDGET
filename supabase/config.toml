# Supabase local development config for PennyPlay.
# https://supabase.com/docs/guides/local-development/cli/config

project_id = "pennyplay"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[auth.email]
enable_signup = true
enable_confirmations = false

# Google OAuth: fill in your credentials, then enable.
[auth.external.google]
enabled = false
client_id = ""
secret = ""

[functions.award-xp]
verify_jwt = true

# Hands the browser the VAPID public key (and mints the keypair on first
# call). Public by design — the key is meant to ship in the client bundle.
[functions.push-key]
verify_jwt = false

# Called by Postgres (pg_cron), not a signed-in user, so it authenticates
# with the shared token in push_config rather than a JWT.
[functions.push-weekly]
verify_jwt = false
